name: Angular isolated branch test preview

on:
  push:
    branches:
      - test/angular-migration
    paths:
      - 'angular/**'
      - 'scripts/export-angular-catalog.mjs'
      - 'scripts/prepare-angular-runtime.mjs'
      - 'scripts/prepare-angular-legacy.mjs'
      - 'scripts/pack-staging-artifacts.mjs'
      - 'dist/**'
      - 'tests/angular-visual-parity.mjs'
      - 'tests/angular-java-submission.mjs'
      - 'tests/angular-java-collections.mjs'
      - 'tests/angular-submit-feedback.mjs'
      - 'tests/angular-submissions-layout.mjs'
      - 'tests/angular-leaderboard-reference.mjs'
      - 'tests/angular-profile-reference.mjs'
      - 'tests/angular-dark-library-reference.mjs'
      - 'tests/angular-dark-library-browser.mjs'
      - 'tests/angular-dark-workspace-board.mjs'
      - 'tests/angular-dark-workspace-board-browser.mjs'
      - 'tests/angular-staging-isolation.mjs'
      - 'tests/angular-api-protocol-e2e.mjs'
      - 'tests/angular-native-shell.mjs'
      - 'tests/angular-browser-navigation.mjs'
      - 'tests/angular-community-parity.mjs'
      - 'tests/angular-feature-e2e.mjs'
      - 'tests/security-hardening.mjs'
      - 'tests/fixtures/reference-solutions.mjs'
      - 'tests/angular-java-runtime-e2e.mjs'
      - 'dist/judge.js'
      - 'dist/runner-core.js'
      - '.github/workflows/angular-branch-preview.yml'
  workflow_dispatch:

# Deliberately no pages:write or id-token:write:
# this workflow MUST NOT deploy over the live github-pages environment.
permissions:
  contents: write

concurrency:
  group: angular-branch-preview
  cancel-in-progress: true

jobs:
  branch-build:
    if: github.repository == 'jagadeeshwaran-r/bytequest'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the isolated test branch
        uses: actions/checkout@v6
        with:
          ref: test/angular-migration
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install preview dependencies
        run: npm install --prefix angular --no-audit --no-fund
      - name: Verify Angular migration invariants
        run: |
          node --test tests/angular-migration.mjs
          node --experimental-strip-types --test tests/angular-editor.mjs
          node --test tests/angular-visual-parity.mjs
          node --experimental-strip-types --test tests/angular-java-submission.mjs
          node --experimental-strip-types --test tests/angular-java-collections.mjs
          node --experimental-strip-types --test tests/angular-submit-feedback.mjs
          node --test tests/angular-submissions-layout.mjs
          node --test tests/angular-leaderboard-reference.mjs
          node --experimental-strip-types --test tests/angular-profile-reference.mjs
          node --experimental-strip-types --test tests/angular-dark-library-reference.mjs
          node --test tests/angular-dark-workspace-board.mjs
          node --experimental-strip-types --test tests/angular-staging-isolation.mjs
          node --experimental-strip-types tests/angular-api-protocol-e2e.mjs
          node --test tests/angular-native-shell.mjs
          node --experimental-strip-types --test tests/angular-community-parity.mjs
      - name: Verify existing ByteQuest backend contracts (no live writes)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node tests/public-java-unlock.mjs
          node tests/reference-security.mjs
          node tests/verified-submit-profile.mjs
          node tests/streak-first-solve-only.mjs
          node tests/social.mjs
          node tests/site-maintenance.mjs
          node tests/security-hardening.mjs
          node tests/public-default-submit.mjs
          node tests/profile-inbox.mjs
      - name: Compile Angular preview
        run: npm run build --prefix angular
      - name: Smoke-test client navigation in Chromium
        run: |
          npm install --prefix angular --no-save --no-audit --no-fund playwright-core@1.56.1
          node tests/angular-browser-navigation.mjs
          node tests/angular-feature-e2e.mjs
          node tests/angular-dark-library-browser.mjs
          node tests/angular-dark-workspace-board-browser.mjs
      - name: Test Java iframe bridge independently of external CDN
        run: BQ_MOCK_JAVA=1 node tests/angular-java-runtime-e2e.mjs
      - name: Diagnose Java runtime CDN reachability
        run: |
          curl --silent --show-error --location --head --max-time 15 'https://cjrtnc.leaningtech.com/5.0/loader.js' | head -n 12 || true
      - name: Execute real Java 17 in Chromium (no production writes)
        timeout-minutes: 5
        run: node tests/angular-java-runtime-e2e.mjs
      - name: Verify public-only preview
        run: |
          test -f angular/dist/angular-preview/index.html
          test -f angular/dist/angular-preview/catalog.json
          test -f angular/dist/angular-preview/java-runtime/judge.js
          test -f angular/dist/angular-preview/java-runtime/runner.html
          test -s angular/dist/angular-preview/java-runtime/java-runner.jar
          test -f angular/dist/angular-preview/legacy/index.html
          test -f angular/dist/angular-preview/legacy/community.html
          test -f angular/dist/angular-preview/legacy/studio.html
          test -f angular/dist/angular-preview/legacy/leaderboard.html
          test -s angular/dist/angular-preview/legacy/java-runner.jar
          ! test -e angular/dist/angular-preview/legacy/native-runner-core.js
          if grep -R --include='*.html' 'service_role' angular/dist/angular-preview; then
            echo 'Unsafe secret reference in preview output' >&2; exit 1
          fi
      - name: Publish compiled assets back to test branch only
        run: |
          mkdir -p branch-preview
          find branch-preview -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a angular/dist/angular-preview/. branch-preview/
          node scripts/pack-staging-artifacts.mjs
          test -s branch-manifest/index.json
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f branch-preview branch-manifest
          if git diff --cached --quiet; then
            echo 'Preview unchanged.'
          else
            git commit -m "chore(test): update isolated Angular preview [skip ci]"
            git push origin HEAD:test/angular-migration
          fi
      - name: Retain build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bytequest-angular-test-branch
          path: branch-preview/
          retention-days: 14
