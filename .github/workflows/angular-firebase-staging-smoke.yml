name: Angular Firebase staging live smoke

on:
  push:
    branches:
      - test/angular-migration
    paths:
      - 'angular/src/app/core/auth.service.ts'
      - 'tests/angular-firebase-staging-smoke.mjs'
      - '.github/workflows/angular-firebase-staging-smoke.yml'
  workflow_dispatch:

# Read-only against Vercel staging and Firebase public project configuration.
# This workflow never authenticates with a real account or sends database writes.
permissions:
  contents: read

jobs:
  firebase-staging-smoke:
    if: github.repository == 'jagadeeshwaran-r/bytequest'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser testing library
        run: npm install --prefix angular --no-audit --no-fund
      - name: Install Chromium automation (no credentials)
        run: npm install --prefix angular --no-save --no-audit --no-fund playwright-core@1.56.1
      - name: Verify live staging Firebase project, authorized domain and Google popup
        run: node tests/angular-firebase-staging-smoke.mjs
